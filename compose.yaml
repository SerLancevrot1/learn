services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
  kafka:
    image: 'apache/kafka:3.9.0'
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Java на хосте получает localhost, а CLI в сети Compose получает DNS-имя kafka.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Служебный журнал транзакций должен помещаться на одном учебном брокере.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-broker-api-versions.sh', '--bootstrap-server', 'localhost:29092']
      interval: 5s
      timeout: 8s
      retries: 15
  redis:
    image: 'redis:7.4-alpine'
    profiles: ['labs']
    ports:
      - '127.0.0.1:6379:6379'
    # AOF показывает разницу между перезапуском процесса и удалением тома.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - 'redis-lab:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15
  rabbitmq:
    image: 'rabbitmq:4.1-management'
    profiles: ['labs']
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: learn
      RABBITMQ_DEFAULT_PASS: learn
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - 'rabbitmq-lab:/var/lib/rabbitmq'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  redis-lab:
  rabbitmq-lab:
