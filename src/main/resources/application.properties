spring.application.name=learn
# Адрес Kafka можно заменить переменной окружения, например для удалённого кластера.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Преобразуют Java String в байты Kafka перед отправкой.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Ждём подтверждение от всех реплик, которые входят в ISR.
spring.kafka.producer.acks=all
# Уникальный transactional.id для каждого запуска приложения; нужен для producer transactions.
spring.kafka.producer.transaction-id-prefix=learn-${random.uuid}-
# Защищает producer от дублей, вызванных повторной отправкой сетевого запроса.
spring.kafka.producer.properties.enable.idempotence=true
# Преобразуют полученные байты Kafka обратно в Java String.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Offset подтверждают listener-ы/транзакционный контейнер, а не фоновый auto-commit.
spring.kafka.consumer.enable-auto-commit=false
# Читатель видит только зафиксированные транзакционные записи.
spring.kafka.consumer.isolation-level=read_committed
