[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    storage.path  /tmp/fluent-bit-buffer

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    storage.type  filesystem

[FILTER]
    Name          parser
    Match         lab.app
    Key_Name      log
    Parser        json
    Reserve_Data  On

[OUTPUT]
    Name                es
    Match               lab.app
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     learn-observability
    Suppress_Type_Name  On
    Generate_ID         On
    Retry_Limit         False
    storage.total_limit_size  32M
