limit_req_zone $binary_remote_addr zone=lab:1m rate=2r/s;
log_format lab_access '$request_id status=$status upstream=$upstream_status '
                      'limit=$limit_req_status request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 80;
    access_log /dev/stdout lab_access;

    location = /limited {
        limit_req zone=lab burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8080/ok;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
    }
}
