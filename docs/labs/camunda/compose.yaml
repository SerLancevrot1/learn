name: learn-camunda

services:
  camunda:
    image: camunda/camunda:8.9.28
    ports:
      # Учебный API открыт только на хосте. Operate и REST работают на одном порту.
      - "127.0.0.1:18088:8080"
    environment:
      # Zeebe ведёт собственный журнал. H2 хранит вторичную проекцию для поиска и Operate.
      CAMUNDA_DATA_SECONDARY_STORAGE_TYPE: rdbms
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_URL: jdbc:h2:file:/usr/local/camunda/data/secondary
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_USERNAME: sa
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_PASSWORD: ""
      CAMUNDA_SECURITY_AUTHENTICATION_METHOD: BASIC
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      # Учебная учётная запись только для входа в Operate.
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_USERNAME: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_PASSWORD: demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_NAME: Demo
      CAMUNDA_SECURITY_INITIALIZATION_USERS_0_EMAIL: demo@example.com
      CAMUNDA_SECURITY_INITIALIZATION_DEFAULTROLES_ADMIN_USERS_0: demo
    volumes:
      # Перезапуск сервиса сохраняет определения, экземпляры и их историю.
      - camunda-data:/usr/local/camunda/data

volumes:
  camunda-data:
